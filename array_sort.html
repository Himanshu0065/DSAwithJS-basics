<!DOCTYPE html>
<html lang="en">
<head>

    <title>Sorting in array</title>
    <script>
        let data=[12,15,3,50,25,35,4,334];
        for(i=0;i<data.length;i++){
         for(j=0;j<data.length; j++){
            
            if(data[j]>data[j+1]){
                let temp= data[j];
                data[j]=data[j+1];
                data[j+1]=temp;
            }
         }
        }console.log(data);

    </script>
</head>
<body>
   <h1>Array sorting in Javascript</h1>
</body>
</html>
