<!DOCTYPE html>
<html lang="en">
<head>
    <title>Merging two Arrays</title>
    <script>
        let data1=[5,10,15,20,25,30];
        let data2=[8,14,22,28];
        let data3=[];
        for(i=0 ; i<data1.length; i++){
            data3[i]=data1[i]
        }
        for(i=0; i<data1.length;i++){
            data3[data1.length+i]=data2[i];
        }
        console.log(data3);
    </script>
</head>

</body>
</html>
